name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - 'hy2.sh'
      - 'install.sh'
      - 'src/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'scripts/**'
      - 'tests/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.github/workflows/release.yml'
  workflow_dispatch: # 手动触发按钮

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # ⚠️关键修复：必须拉取完整历史，否则获取不到之前的 Tag

      - name: Extract Version
        id: get_version
        run: |
          # 从模块化源码入口中提取 sh_ver 变量的值
          VERSION=$(sed -n 's/^sh_ver="\(v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p' src/bootstrap.sh | head -n 1 || echo "")

          if [ -z "$VERSION" ]; then
            echo "❌ 致命错误：无法在 src/bootstrap.sh 中找到 sh_ver 变量！"
            exit 1
          fi

          echo "成功提取到版本号: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            echo "VERSION_TAG_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "VERSION_TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats python3 curl

      - name: Install pinned sing-box test binary
        run: bash scripts/install-test-sing-box.sh

      - name: Make verify scripts executable
        run: chmod +x scripts/verify.sh scripts/build-panel.sh scripts/check-style.sh scripts/check-menu-sync.sh scripts/check-version-sync.sh scripts/check-release-package.sh scripts/smoke-e2e.sh tests/e2e/config-flow.sh tests/e2e/client-render.sh

      - name: Run bash syntax checks
        run: ./scripts/verify.sh syntax

      - name: Check generated panel
        run: ./scripts/verify.sh generated-panel

      - name: Check repository style
        run: ./scripts/verify.sh style

      - name: Run shellcheck
        run: ./scripts/verify.sh shellcheck

      - name: Check menu sync
        run: ./scripts/verify.sh menu-sync

      - name: Check version sync
        run: ./scripts/verify.sh version-sync

      - name: Check release package guardrails
        run: ./scripts/verify.sh release-package

      - name: Run smoke E2E
        run: ./scripts/verify.sh smoke-e2e

      - name: Run bats tests
        run: ./scripts/verify.sh bats

      - name: Run config flow replay
        run: ./scripts/verify.sh config-flow

      - name: Run client render flow
        run: REQUIRE_SING_BOX_CHECK=1 ./scripts/verify.sh client-render

      - name: Check if Release is Needed
        id: check_release
        run: |
          if [ "${{ env.VERSION_TAG_EXISTS }}" = "true" ]; then
            echo "版本 ${{ env.VERSION }} 已存在，无需发布新 Release。自动跳过。"
            echo "should_release=false" >> "$GITHUB_ENV"
          else
            echo "检测到新版本: ${{ env.VERSION }}。准备自动发布！"
            echo "should_release=true" >> "$GITHUB_ENV"
          fi

      - name: Package Code
        if: env.should_release == 'true'
        run: |
          tar \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="AGENTS.md" \
            --exclude="LOCAL_WORK_MEMORY.md" \
            --exclude="PROJECT_MEMORY.md" \
            --exclude=".codex-ci-check*" \
            --exclude="code.tar.gz" \
            --exclude="SHA256SUMS" \
            --exclude="RELEASE_BODY.md" \
            -zcvf ../code.tar.gz .
          mv ../code.tar.gz ./

      - name: Validate Release Package
        if: env.should_release == 'true'
        run: bash scripts/check-release-package.sh code.tar.gz

      - name: Generate Checksums
        if: env.should_release == 'true'
        run: |
          sha256sum code.tar.gz hy2.sh install.sh > SHA256SUMS

      - name: Build Release Notes
        if: env.should_release == 'true'
        run: |
          {
            echo "## 主要变化"
            echo
            awk -v version="${VERSION}" '
              $0 == "## " version || index($0, "## " version " - ") == 1 {
                in_section = 1
                next
              }
              in_section && /^## / {
                exit
              }
              in_section {
                print
              }
            ' CHANGELOG.md | sed '/^[[:space:]]*$/d'
          } > RELEASE_BODY.md

          if [ "$(wc -l < RELEASE_BODY.md)" -le 2 ]; then
            echo "- 本版本暂无详细说明。" >> RELEASE_BODY.md
          fi

      - name: Create Release
        if: env.should_release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            code.tar.gz
            hy2.sh
            install.sh
            SHA256SUMS
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body_path: RELEASE_BODY.md
          prerelease: false

      - name: Promote Existing Pre-release
        if: env.should_release == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! IS_PRERELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" --jq '.prerelease' 2>/dev/null); then
            echo "未找到版本 ${VERSION}，无需转为正式发布。"
            exit 0
          fi

          if [ "${IS_PRERELEASE}" != "true" ]; then
            echo "版本 ${VERSION} 已是正式发布，无需修改。"
            exit 0
          fi

          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" --jq '.id')
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F prerelease=false \
            -f make_latest=true >/dev/null
          echo "版本 ${VERSION} 已从 Pre-release 转为正式 Latest。"
