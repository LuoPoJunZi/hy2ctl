name: Lint

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'hy2.sh'
      - 'install.sh'
      - 'src/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'scripts/**'
      - 'tests/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.github/workflows/*.yml'

jobs:
  verify-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats python3 curl

      - name: Install pinned sing-box test binary
        run: bash scripts/install-test-sing-box.sh

      - name: Run complete verification suite
        run: REQUIRE_SING_BOX_CHECK=1 bash scripts/verify.sh all

  verify-debian:
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y bash git shellcheck bats grep sed gawk coreutils python3 curl ca-certificates

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pinned sing-box test binary
        run: bash scripts/install-test-sing-box.sh

      - name: Run complete verification suite
        run: REQUIRE_SING_BOX_CHECK=1 bash scripts/verify.sh all
